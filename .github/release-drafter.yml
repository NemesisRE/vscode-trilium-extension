name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

autolabeler:
  - label: 'breaking-change'
    branch:
      - '/^breaking-change\/.+/'
    title:
      - '/^[a-z]+(\(.+\))?!:/'
    body:
      - '/BREAKING CHANGE:/i'
  - label: 'feature'
    branch:
      - '/^feat\/.+/'
      - '/^feature\/.+/'
    title:
      - '/^feat(\(.+\))?!?:/i'
    body:
      - '/^feat(\(.+\))?!?:/im'
  - label: 'fix'
    branch:
      - '/^fix\/.+/'
      - '/^bugfix\/.+/'
    title:
      - '/^fix(\(.+\))?!?:/i'
    body:
      - '/^fix(\(.+\))?!?:/im'
  - label: 'chore'
    branch:
      - '/^chore\/.+/'
    title:
      - '/^chore(\(.+\))?!?:/i'
    body:
      - '/^chore(\(.+\))?!?:/im'
  - label: 'documentation'
    branch:
      - '/^docs?\/.+/'
    title:
      - '/^docs?(\(.+\))?!?:/i'
    body:
      - '/^docs?(\(.+\))?!?:/im'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'maintenance'
  - title: '📖 Documentation'
    labels:
      - 'documentation'
      - 'docs'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking-change'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'chore'
      - 'documentation'
      - 'docs'
      - 'maintenance'
      - 'dependencies'
  default: patch

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
