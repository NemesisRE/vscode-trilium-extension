name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate React dependency alignment
        run: npm run check:react-deps

      - name: Cache Trilium CKEditor plugins
        id: trilium-cache
        uses: actions/cache@v6
        with:
          path: vendor/
          key: trilium-plugins-${{ hashFiles('scripts/trilium-plugins.lock.json', 'scripts/download-trilium-plugins.mjs', 'scripts/patch-trilium-plugins.mjs', 'scripts/apply-vendor-patches.mjs') }}

      - name: Download Trilium CKEditor plugins
        if: steps.trilium-cache.outputs.cache-hit != 'true'
        run: node scripts/download-trilium-plugins.mjs

      - name: Patch Trilium plugins
        if: steps.trilium-cache.outputs.cache-hit == 'true'
        run: node scripts/patch-trilium-plugins.mjs

      - name: Type check
        run: npm run compile

  test-and-build:
    name: Test & Build
    needs: typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate React dependency alignment
        run: npm run check:react-deps

      - name: Cache Trilium CKEditor plugins
        id: trilium-cache
        uses: actions/cache@v6
        with:
          path: vendor/
          key: trilium-plugins-${{ hashFiles('scripts/trilium-plugins.lock.json', 'scripts/download-trilium-plugins.mjs', 'scripts/patch-trilium-plugins.mjs', 'scripts/apply-vendor-patches.mjs') }}

      - name: Download Trilium CKEditor plugins
        if: steps.trilium-cache.outputs.cache-hit != 'true'
        run: node scripts/download-trilium-plugins.mjs

      - name: Patch Trilium plugins
        if: steps.trilium-cache.outputs.cache-hit == 'true'
        run: node scripts/patch-trilium-plugins.mjs

      - name: Run unit tests
        run: npm test

      - name: Cache VS Code test download
        uses: actions/cache@v6
        with:
          path: .vscode-test/
          key: vscode-test-bin-${{ runner.os }}

      - name: Run integration tests (VS Code extension host)
        run: |
          for attempt in 1 2 3; do
            if xvfb-run -a npm run test:integration; then
              exit 0
            fi
            echo "Integration tests attempt $attempt failed, retrying in 15s..." >&2
            sleep 15
          done
          exit 1

      - name: Build extension bundle
        run: npm run build:prod

