name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate React dependency alignment
        run: npm run check:react-deps

      - name: Cache Trilium CKEditor plugins
        uses: actions/cache@v5
        with:
          path: vendor/
          key: trilium-plugins-${{ hashFiles('scripts/trilium-plugins.lock.json', 'scripts/download-trilium-plugins.mjs', 'scripts/patch-trilium-plugins.mjs', 'scripts/apply-vendor-patches.mjs') }}
          restore-keys: |
            trilium-plugins-

      - name: Patch Trilium plugins
        run: node scripts/patch-trilium-plugins.mjs

      - name: Type check
        run: npm run compile

  test-and-build:
    name: Test & Build
    needs: typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate React dependency alignment
        run: npm run check:react-deps

      - name: Cache Trilium CKEditor plugins
        uses: actions/cache@v5
        with:
          path: vendor/
          key: trilium-plugins-${{ hashFiles('scripts/trilium-plugins.lock.json', 'scripts/download-trilium-plugins.mjs', 'scripts/patch-trilium-plugins.mjs', 'scripts/apply-vendor-patches.mjs') }}
          restore-keys: |
            trilium-plugins-

      - name: Patch Trilium plugins
        run: node scripts/patch-trilium-plugins.mjs

      - name: Run unit tests
        run: npm test

      - name: Run integration tests (VS Code extension host)
        run: xvfb-run -a npm run test:integration

      - name: Build extension bundle
        run: npm run build:prod

