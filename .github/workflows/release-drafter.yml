name: Release Drafter

on:
  push:
    branches: [main]
  # pull_request_target also fires for same-repo (non-fork) PRs, and covers
  # fork PRs with write access besides - a plain pull_request trigger here
  # would just double-run this job on every same-repo PR update. The
  # autolabeler step never checks out PR code, so this carries no privilege-
  # escalation risk despite running with base-repo token permissions.
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto_label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    permissions:
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_release_draft:
    name: Update Release Draft
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'main'
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
