name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build, Publish and Sync Version
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release metadata
        id: release_meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must use v<major>.<minor>.<patch>, got: $RELEASE_TAG" >&2
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target_branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout repository at release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Trilium CKEditor plugins
        id: trilium-cache
        uses: actions/cache@v6
        with:
          path: vendor/
          key: trilium-plugins-${{ hashFiles('scripts/trilium-plugins.lock.json', 'scripts/download-trilium-plugins.mjs', 'scripts/patch-trilium-plugins.mjs', 'scripts/apply-vendor-patches.mjs') }}

      - name: Download Trilium CKEditor plugins
        if: steps.trilium-cache.outputs.cache-hit != 'true' || hashFiles('vendor/ckeditor5/**') == ''
        run: node scripts/download-trilium-plugins.mjs

      - name: Patch Trilium plugins
        if: steps.trilium-cache.outputs.cache-hit == 'true' && hashFiles('vendor/ckeditor5/**') != ''
        run: node scripts/patch-trilium-plugins.mjs

      - name: Sync package.json version to release tag
        run: npm run release:sync-version -- ${{ steps.release_meta.outputs.version }}

      - name: Type check
        run: npm run compile

      - name: Run unit tests
        run: npm test

      - name: Cache VS Code test download
        uses: actions/cache@v6
        with:
          path: .vscode-test/
          key: vscode-test-bin-${{ runner.os }}

      - name: Run integration tests (VS Code extension host)
        run: |
          for attempt in 1 2 3; do
            if xvfb-run -a npm run test:integration; then
              exit 0
            fi
            echo "Integration tests attempt $attempt failed, retrying in 15s..." >&2
            sleep 15
          done
          exit 1

      - name: Build extension bundle
        run: npm run build:prod

      - name: Package VSIX
        id: package_vsix
        run: |
          npm run package:vsix
          VSIX_PATH="$(find . -maxdepth 1 -name '*.vsix' -print | head -n 1)"
          if [[ -z "$VSIX_PATH" ]]; then
            echo "VSIX package was not created" >&2
            exit 1
          fi
          echo "vsix_path=$VSIX_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: trilium-notes-vsix
          path: ${{ steps.package_vsix.outputs.vsix_path }}
          if-no-files-found: error

      - name: Publish to Visual Studio Marketplace
        if: ${{ always() && steps.package_vsix.outcome == 'success' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath "${{ steps.package_vsix.outputs.vsix_path }}" --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: ${{ always() && steps.package_vsix.outcome == 'success' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx@0.10.12 publish "${{ steps.package_vsix.outputs.vsix_path }}"

      - name: Attach VSIX to GitHub Release
        if: ${{ always() && steps.package_vsix.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package_vsix.outputs.vsix_path }}" --clobber

      - name: Sync package.json back to default branch
        if: always()
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
          TARGET_BRANCH: ${{ steps.release_meta.outputs.target_branch }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          git checkout -B release-version-sync "origin/$TARGET_BRANCH"
          npm run release:sync-version -- "$RELEASE_VERSION"

          if git diff --quiet -- package.json; then
            echo "package.json already matches $RELEASE_VERSION on $TARGET_BRANCH"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: sync package version to $RELEASE_VERSION"
          git push origin HEAD:"$TARGET_BRANCH"
